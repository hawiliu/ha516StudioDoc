<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ha516Studio</title>
    <!-- Dynamic base: works on GitHub Pages (/ha516StudioDoc/) and local dev servers (/) -->
    <script>
        (function () {
            var base = document.createElement('base');
            base.href = location.pathname.startsWith('/ha516StudioDoc')
                ? '/ha516StudioDoc/'
                : '/';
            document.head.appendChild(base);
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ── Language Picker ───────────────────────────── */
        #lang-picker-wrap {
            position: fixed;
            top: 1rem;
            right: 1.25rem;
            z-index: 100;
            display: flex;
            gap: 0.35rem;
        }

        .lang-btn {
            padding: 0.3rem 0.65rem;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }

        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
        }

        .lang-btn.active {
            background: rgba(255, 255, 255, 0.28);
            border-color: rgba(255, 255, 255, 0.6);
            color: #fff;
        }

        /* ── Page transition ───────────────────────────── */
        #content {
            opacity: 1;
            transition: opacity 0.2s ease;
            min-height: 60vh;
        }
    </style>
</head>

<body class="landing-page">

    <!-- Language picker (populated by lang.js) -->
    <div id="lang-picker-wrap">
        <div id="lang-picker"></div>
    </div>

    <!-- Page content injected here by router.js -->
    <main id="content"></main>

    <!-- Scripts (order matters: lang before router) -->
    <script src="lang.js"></script>
    <script src="router.js"></script>
    <script>
        (async () => {
            await i18n.init();   // load translations, render picker, apply i18n
            router.init();       // start routing (will fetch first fragment)
        })();
    </script>

</body>

</html>
